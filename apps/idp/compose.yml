services:
  idp:
    image: ${IDP_IMAGE:?IDP_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IDP_APP_ENV: ${IDP_APP_ENV:-production}
      IDP_HOST: 0.0.0.0
      IDP_PORT: ${IDP_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      AUTH_SESSION_EXPIRES_IN_SECONDS: ${AUTH_SESSION_EXPIRES_IN_SECONDS:-2592000}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      AUTH_EMAIL_VERIFICATION_CALLBACK_URL: ${AUTH_EMAIL_VERIFICATION_CALLBACK_URL:?AUTH_EMAIL_VERIFICATION_CALLBACK_URL is required}
      AUTH_PASSWORD_RESET_REDIRECT_URL: ${AUTH_PASSWORD_RESET_REDIRECT_URL:?AUTH_PASSWORD_RESET_REDIRECT_URL is required}
