# Render Blueprint for SAC Nexus (free tier).
#
# Deploy: Render dashboard → New → Blueprint → select this repo/branch.
# After the services are created, fill the env vars marked `sync: false`
# (secrets + cross-service URLs) in each service's Environment tab.
#
# Free-tier notes:
# - The IDP (web service) spins down after ~15 min idle → cold start on next hit.
# - Neon (DATABASE_URL) also cold-starts; the readiness check tolerates ~5s.
# - Verify the Node version: `.node-version` pins 26 — if Render lacks it,
#   set NODE_VERSION to a supported LTS on both services.

services:
  # --- Domain API / IDP (Fastify) ---
  - type: web
    name: sac-nexus-idp
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter idp build
    startCommand: pnpm --filter idp start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: IDP_APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: BETTER_AUTH_SECRET
        generateValue: true # >= 32 chars
      - key: BETTER_AUTH_URL
        sync: false # this service's public URL, e.g. https://sac-nexus-idp.onrender.com
      - key: AUTH_TRUSTED_ORIGINS
        sync: false # the web URL(s), comma-separated
      - key: CORS_ORIGINS
        sync: false # the web URL(s), comma-separated
      # Email is not wired yet — placeholders so the service boots. Replace when
      # email (Resend) is enabled.
      - key: RESEND_API_KEY
        value: disabled
      - key: AUTH_EMAIL_FROM
        value: SAC Nexus <no-reply@sac-nexus.dev>
      - key: AUTH_EMAIL_VERIFICATION_CALLBACK_URL
        value: https://sac-nexus.dev/auth/email-verified
      - key: AUTH_PASSWORD_RESET_REDIRECT_URL
        value: https://sac-nexus.dev/auth/reset-password
      # Tigris (S3-compatible) object storage for uploaded documents (N1-01 PDFs).
      - key: TIGRIS_ENDPOINT
        value: https://t3.storage.dev
      - key: TIGRIS_REGION
        value: auto
      - key: TIGRIS_BUCKET
        value: sacnexus
      - key: TIGRIS_ACCESS_KEY_ID
        sync: false # Tigris access key id
      - key: TIGRIS_SECRET_ACCESS_KEY
        sync: false # Tigris secret access key

  # --- Web (Vite SPA, served as a static site) ---
  - type: web
    name: sac-nexus-web
    runtime: static
    rootDir: .
    # The SPA fetches /config.json at runtime; the static build does not emit it,
    # so generate it from the VITE_* env vars right after `vite build`.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build && node apps/web/scripts/write-config.mjs
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # the IDP URL + /api, e.g. https://sac-nexus-idp.onrender.com/api
      - key: VITE_AUTH_URL
        sync: false # the IDP URL + /api/auth, e.g. https://sac-nexus-idp.onrender.com/api/auth
      - key: VITE_APP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
